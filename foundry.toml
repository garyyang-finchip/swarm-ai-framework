[profile.default]
src = "assets/erc-8447/contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1
via_ir = true

fs_permissions = [
  { access = "read", path = "./assets/erc-8447/vectors" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 100
